name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'   # fallback to 20 if .nvmrc missing
          cache: 'npm'                 # caches ~/.npm; speeds up install

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run typecheck (with increased memory)
        run: npm run typecheck
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build project (validate transpilation)
        run: npm run build
